name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Syntax & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every JavaScript file
        run: |
          set -e
          fail=0
          for f in $(git ls-files '*.js'); do
            if ! node --check "$f"; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done
          exit $fail

      - name: Static sanity checks
        run: node scripts/ci-checks.mjs

  database:
    name: Database behaviour tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: partfit
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply migrations and run the SQL test suites
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/partfit
        run: ./scripts/db-test.sh
