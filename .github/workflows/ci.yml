name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Syntax & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every JavaScript file
        run: |
          set -e
          fail=0
          for f in $(git ls-files '*.js'); do
            if ! node --check "$f"; then
              echo "::error file=$f::syntax error"
              fail=1
            fi
          done
          exit $fail

      - name: Static sanity checks
        run: node scripts/ci-checks.mjs
