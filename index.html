<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06254b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PartFit Ghana"><meta name="description" content="Find car parts that fit and order on WhatsApp."><title>PartFit Ghana</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><div id="app" class="shell"></div><div id="toast" class="toast"></div><script>const CFG={wa:'233551234567',pickup:'PartFit Ghana — Spintex Pickup',addr:'Spintex Road, Accra (near Shell Spintex)'};const cars={Toyota:['Corolla','Yaris','RAV4'],Hyundai:['i10','i20','Elantra'],Kia:['Picanto','Rio','Cerato'],Nissan:['Micra','Note','Qashqai'],Honda:['Jazz','Civic'],Ford:['Fiesta','Focus'],Volkswagen:['Polo','Golf']};const parts=[{id:'ngk',name:'NGK Spark Plug — BKR6E-11',cat:'Spark Plugs',no:'BKR6E-11',price:40,ico:'⚡',fits:['Toyota Corolla','Toyota Yaris','Hyundai Elantra','Kia Rio','Honda Civic']},{id:'denso',name:'Denso Spark Plug — K16TT',cat:'Spark Plugs',no:'K16TT',price:35,ico:'⚡',fits:['Toyota Corolla','Toyota Yaris','Kia Rio','Hyundai i20']},{id:'air',name:'Engine Air Filter — A-1234',cat:'Air Filters',no:'A-1234',price:85,ico:'🟨',fits:['Toyota Corolla','Hyundai Elantra','Kia Cerato']},{id:'cabin',name:'A/C Cabin Filter — CAF-182',cat:'Cabin Filters',no:'CAF-182',price:70,ico:'▤',fits:['Toyota RAV4','Nissan Qashqai']}];const cats=[['Spark Plugs','⚡'],['Air Filters','🟨'],['Cabin Filters','▤'],['Oil Filters','⬛'],['Brake Pads','◼️'],['Belts','⭕']];let S={vehicle:JSON.parse(localStorage.getItem('pfVehicle')||'null'),cart:JSON.parse(localStorage.getItem('pfCart')||'[]'),cat:'All',selected:null,prompt:null};const app=document.getElementById('app'),toast=document.getElementById('toast');const money=n=>'GH₵ '+n.toFixed(2),save=()=>{localStorage.setItem('pfVehicle',JSON.stringify(S.vehicle));localStorage.setItem('pfCart',JSON.stringify(S.cart))},veh=()=>S.vehicle?S.vehicle.make+' '+S.vehicle.model+' '+S.vehicle.year+' · '+S.vehicle.engine:'No vehicle selected',fits=p=>S.vehicle?p.fits.includes(S.vehicle.make+' '+S.vehicle.model):null;function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}function top(t,s=''){return '<header class="top"><div class="logo">PF</div><div class="title">'+t+(s?'<small>'+s+'</small>':'')+'</div><div class="grow"></div><button class="cartBtn" data-page="order">🛒 '+S.cart.reduce((a,b)=>a+b.qty,0)+'</button></header>'}function nav(active){return '<nav class="bottom">'+[['home','⌂','Home'],['vehicle','🚗','My Car'],['catalogue','▦','Parts'],['order','🧾','Order']].map(x=>'<button class="'+(active===x[0]?'on':'')+'" data-page="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')+'<button data-help><span>◉</span>WhatsApp</button></nav>'}function card(p){let f=fits(p);return '<article class="card product" data-product="'+p.id+'"><div class="pic">'+p.ico+'</div><div><h3>'+p.name+'</h3><div class="muted">'+(f===true?'✓ Fits your car':f===false?'Check fitment':p.cat)+'</div><div class="price">'+money(p.price)+'</div><div class="stock">● In stock</div></div><button class="plus" data-add="'+p.id+'">+</button></article>'}function home(){app.innerHTML=top('PartFit Ghana','Right Part. Right Car.')+'<main class="page"><section class="hero"><h1>Find the right parts for your car.</h1><p>Select your vehicle, check fitment and order directly on WhatsApp.</p><div class="row"><button class="btn red" data-page="vehicle">🚗 Select My Car</button><button class="btn outline" data-help>WhatsApp Help</button></div></section>'+(S.vehicle?'<div class="sec notice">✓ Vehicle selected: <b>'+veh()+'</b></div>':'')+'<section class="sec"><div class="head"><h2>Shop by category</h2></div><div class="cats">'+cats.map(c=>'<button class="cat" data-cat="'+c[0]+'"><i>'+c[1]+'</i><b>'+c[0]+'</b></button>').join('')+'</div></section><section class="sec"><div class="head"><h2>Popular parts</h2></div><div class="products">'+parts.map(card).join('')+'</div></section><section class="sec card form">📍 <b>'+CFG.pickup+'</b><div class="muted">'+CFG.addr+'</div></section></main><button class="installBtn" data-install>＋ Add to Home Screen</button>'+nav('home')}function vehicle(){app.innerHTML=top('Find Parts for Your Car','Make · Model · Year · Engine')+'<main class="page"><section class="card form"><div class="field"><label>Make</label><select id="make">'+Object.keys(cars).map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Model</label><select id="model"></select></div><div class="grid2"><div class="field"><label>Year</label><select id="year">'+[2009,2010,2011,2012,2013,2014,2015,2016].map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Engine</label><select id="engine"><option>1.0 Petrol</option><option>1.2 Petrol</option><option>1.4 Petrol</option><option selected>1.6 Petrol</option><option>1.8 Petrol</option><option>2.0 Petrol</option></select></div></div><button class="btn red full" data-save-car>Find Parts</button></section></main>'+nav('vehicle');fillModels()}function fillModels(){let m=document.getElementById('make'),d=document.getElementById('model');if(!m||!d)return;d.innerHTML=cars[m.value].map(x=>'<option>'+x+'</option>').join('')}function catalogue(){let list=S.cat==='All'?parts:parts.filter(p=>p.cat===S.cat);app.innerHTML=top('Product Catalogue',S.vehicle?veh():'Browse available sample parts')+'<main class="page"><div class="chips">'+['All',...cats.map(x=>x[0])].map(x=>'<button class="chip '+(S.cat===x?'on':'')+'" data-cat="'+x+'">'+x+'</button>').join('')+'</div>'+(S.vehicle?'<div class="sec notice">✓ Compatible items for <b>'+veh()+'</b> are marked.</div>':'')+'<section class="sec products">'+(list.length?list.map(card).join(''):'<div class="card empty">No sample item in this category yet.</div>')+'</section></main>'+nav('catalogue')}function product(id){let p=parts.find(x=>x.id===id)||parts[0],f=fits(p);S.selected=p.id;app.innerHTML=top('Product Details',p.no)+'<main class="page"><article class="card detail"><div class="visual">'+p.ico+'</div><div class="detailBody"><h1>'+p.name+'</h1><div class="muted">Part No. '+p.no+'</div><div class="price" style="font-size:21px;margin-top:8px">'+money(p.price)+'</div><div class="fit '+(f===false?'warn':'')+'"><b>'+(f===true?'✓ Fits your vehicle':f===false?'! Fitment not confirmed':'? Select your car to check fitment')+'</b><div class="muted">'+veh()+'</div></div><p>Sample product details for the PartFit Ghana catalogue. Confirm OE/reference compatibility before sale.</p><div class="row"><button class="btn red" data-add="'+p.id+'" data-order>Add to Order</button><button class="btn outline" data-product-wa="'+p.id+'">WhatsApp</button></div></div></article></main>'+nav('catalogue')}function order(){let total=S.cart.reduce((a,i)=>a+parts.find(p=>p.id===i.id).price*i.qty,0);app.innerHTML=top('Your Order','Review and send')+'<main class="page">'+(!S.cart.length?'<div class="card empty"><h2>🛒 No parts yet</h2><button class="btn red" data-page="catalogue">Browse Parts</button></div>':'<section class="card">'+S.cart.map(i=>{let p=parts.find(x=>x.id===i.id);return '<div class="cartItem"><div class="pic">'+p.ico+'</div><div><b>'+p.name+'</b><div class="muted">'+p.no+'</div><div class="qty"><button data-qty="-1" data-id="'+p.id+'">−</button><b>'+i.qty+'</b><button data-qty="1" data-id="'+p.id+'">+</button></div></div><b>'+money(p.price*i.qty)+'</b></div>'}).join('')+'</section><section class="sec card summary"><div class="sum total"><span>Total</span><span class="price">'+money(total)+'</span></div></section><section class="sec card form"><div class="field"><label>Full name *</label><input id="name"></div><div class="field"><label>Phone / WhatsApp *</label><input id="phone" inputmode="tel"></div><div class="field"><label>Vehicle</label><input value="'+veh()+'" readonly></div><div class="field"><label>Order note</label><textarea id="note"></textarea></div><label class="location"><input type="radio" checked> <span><b>'+CFG.pickup+'</b><br><small>'+CFG.addr+'</small></span></label><button class="btn wa full" data-submit>Send Order on WhatsApp</button></section>')+'</main>'+nav('order')}function add(id,toOrder){let i=S.cart.find(x=>x.id===id);i?i.qty++:S.cart.push({id,qty:1});save();say('Added to order');toOrder?order():catalogue()}function whatsapp(text){window.open('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(text),'_blank')}function render(page){({home,vehicle,catalogue,order}[page]||home)()}document.addEventListener('change',e=>{if(e.target.id==='make')fillModels()});document.addEventListener('click',e=>{let pg=e.target.closest('[data-page]');if(pg){render(pg.dataset.page);return}let c=e.target.closest('[data-cat]');if(c){S.cat=c.dataset.cat;catalogue();return}let p=e.target.closest('[data-product]');if(p&&!e.target.closest('[data-add]')){product(p.dataset.product);return}let a=e.target.closest('[data-add]');if(a){add(a.dataset.add,a.hasAttribute('data-order'));return}let q=e.target.closest('[data-qty]');if(q){let i=S.cart.find(x=>x.id===q.dataset.id);i.qty+=Number(q.dataset.qty);if(i.qty<1)S.cart=S.cart.filter(x=>x.id!==q.dataset.id);save();order();return}if(e.target.closest('[data-save-car]')){S.vehicle={make:document.getElementById('make').value,model:document.getElementById('model').value,year:document.getElementById('year').value,engine:document.getElementById('engine').value};save();catalogue();return}if(e.target.closest('[data-help]')){whatsapp('Hello PartFit Ghana, I need help finding the correct part'+(S.vehicle?' for my '+veh():'.'));return}let pw=e.target.closest('[data-product-wa]');if(pw){let p=parts.find(x=>x.id===pw.dataset.productWa);whatsapp('Hello PartFit Ghana, please confirm '+p.name+' ('+p.no+') for '+veh()+'.');return}if(e.target.closest('[data-submit]')){let n=document.getElementById('name').value.trim(),ph=document.getElementById('phone').value.trim();if(!n||!ph){say('Enter your name and phone');return}let lines=S.cart.map(i=>{let p=parts.find(x=>x.id===i.id);return p.name+' x'+i.qty+' — '+money(p.price*i.qty)}),total=S.cart.reduce((a,i)=>a+parts.find(p=>p.id===i.id).price*i.qty,0);whatsapp('Hello PartFit Ghana, I would like to order:\n'+lines.join('\n')+'\nTotal: '+money(total)+'\nVehicle: '+veh()+'\nName: '+n+'\nPhone: '+ph+'\nCollection: '+CFG.pickup);return}if(e.target.closest('[data-install]')){if(S.prompt){S.prompt.prompt()}else{alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?'In Safari tap Share, then Add to Home Screen.':'Open your browser menu and choose Install app or Add to Home screen.')}}});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.prompt=e});home();</script></body></html>
